  <style>
    .counter-display {
      margin: 1.5rem 0;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--accent-color);
      text-align: center;
      padding: 1.5rem;
      background: rgba(15, 23, 42, 0.7);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);

<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="logo-conquer.png" alt="Conquer Blocks Logo" class="logo-img">

      <a href="index.html" class="back-link">&larr; Volver al índice</a>

  <main>
    <h1 class="page-title"><span class="title-highlight">Ejercicio 2:</span> Contador de Clics</h1>
    <p class="page-description">
      Cada vez que hagas clic en el botón, el contador se incrementará en 1.
    </p>

    <div class="card" style="max-width: 500px; margin: 0 auto; text-align: center;">
      <div id="counter-text" class="counter-display">
        Clics: 0
      </div>

      <div class="btn-group" style="justify-content: center;">
        <button id="btn-count" class="btn" style="flex: 1;">
          Contar clics
        </button>
        <button id="btn-reset" class="btn btn-secondary">
          Reiniciar
        </button>
      </div>
    </div>
  </main>
