    .timer-display {
      font-size: 3.5rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--accent-color);
      text-align: center;
      padding: 2rem 1rem;
      background: #0d0d0d;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);

  <header>
    <div class="nav-container">

  <main>
    <h1 class="page-title"><span class="title-highlight">Ejercicio 6:</span> Temporizador con Inicio, Pausa y Reinicio</h1>
    <p class="page-description">
      Controla el tiempo en formato horas:minutos:segundos usando funciones de temporización en JavaScript.
    </p>

    <div class="card" style="max-width: 550px; margin: 0 auto; text-align: center;">
      <div id="timer-text" class="timer-display">
        00:00:00
      </div>

      <div class="btn-group" style="justify-content: center;">
        <button id="btn-start" class="btn">
          Iniciar
        </button>
        <button id="btn-pause" class="btn btn-secondary">
          Pausar
        </button>
        <button id="btn-reset" class="btn btn-danger">
          Reiniciar
        </button>
      </div>
    </div>
  </main>
