<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - Filtro de Búsqueda en Tiempo Real</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .search-box {
      margin-bottom: 1.5rem;
      position: relative;
    }
    .items-grid {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.75rem;
    }
    .item-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      text-align: center;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .item-card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 2rem;
      font-style: italic;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-badge">A</span>
        <span><span class="brand-highlight">Conquer Blocks</span> | <span class="author-name">Alba Domínguez García</span></span>
      </a>
      <a href="index.html" class="back-link">&larr; Volver al índice</a>
    </div>
  </header>

  <main>
    <h1 class="page-title"><span class="title-highlight">Ejercicio 4:</span> Filtro de Búsqueda en Tiempo Real</h1>
    <p class="page-description">
      Escribe en el buscador para filtrar la lista predefinida de elementos instantáneamente.
    </p>

    <div class="card" style="max-width: 650px; margin: 0 auto;">
      <div class="search-box">
        <label for="search-input">Buscador en tiempo real:</label>
        <input type="text" id="search-input" placeholder="Escribe para buscar (ej: Gato, Perro, Pez)..." autocomplete="off">
      </div>

      <ul id="items-list" class="items-grid">
        <!-- Los elementos de la lista se cargarán dinámicamente -->
      </ul>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Entrega de Ejercicios JavaScript - Alba Domínguez García</p>
  </footer>

  <script src="js_ejercicio_4.js"></script>
</body>
</html>
